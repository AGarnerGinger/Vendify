{% extends "base.html" %}
{% block title %}Home - Vendify{% endblock %}
{% block content %}
<h2>Featured Products</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px;">
    {% for p in products %}
    <div class="product-card">
        <h3>{{ p.title }}</h3>
        <p><strong>${{ p.price }}</strong></p>
        <p>Stock: {{ p.inventory }}</p>
        <a href="/product/{{ p.product_id }}">View Details</a><br>
        <button onclick="addToCart({{ p.product_id }})">Add to Cart</button>
    </div>
    {% endfor %}
</div>

<script>
function addToCart(id) {
    fetch(`/cart/add/${id}`, { method: 'POST' })
    .then(r => r.json())
    .then(() => alert('Added to cart!'));
}
</script>
{% endblock %}
