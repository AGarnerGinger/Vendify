{% extends "base.html" %}
{% block title %}Edit Product - Vendify{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Edit Product: {{ product.title }}</h4>
                </div>
                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Product Title</label>
                            <input type="text" name="title" class="form-control"
                                   value="{{ product.title }}" required>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Regular Price ($)</label>
                                <input type="number" step="0.01" name="price" class="form-control"
                                       value="{{ product.price }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Sale Price ($)</label>
                                <input type="number" step="0.01" name="sale_price" class="form-control"
                                       value="{{ product.sale_price if product.sale_price else '' }}"
                                       placeholder="Leave blank if not on sale">
                                <small class="text-muted">If filled, this will be the displayed price</small>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label class="form-label fw-bold">Inventory (Stock)</label>
                            <input type="number" name="inventory" class="form-control" min="0"
                                   value="{{ product.inventory }}" required>
                        </div>

                        <!-- Current Image -->
                        {% if product.image %}
                        <div class="mb-4">
                            <label class="form-label fw-bold">Current Image</label><br>
                            <img src="{{ url_for('static', filename='uploads/products/' + product.image) }}"
                                 class="img-fluid rounded border mb-2"
                                 style="max-height: 220px; object-fit: contain;" alt="Current">
                        </div>
                        {% endif %}

                        <!-- New Image Upload -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Change Image (Optional)</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                            <small class="text-muted">Upload a new image to replace the current one</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="5">{{ product.description or '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/vendor/products" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-success btn-lg">Update Product</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
