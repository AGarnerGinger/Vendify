{% extends "base.html" %}
{% block title %}Edit Product - Vendify{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Product: {{ product.title }}</h4>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" name="title" class="form-control" value="{{ product.title }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Inventory</label>
                        <input type="number" name="inventory" class="form-control" value="{{ product.inventory }}" min="0" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Regular Price ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" min="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Sale Price ($)</label>
                        <input type="number" step="0.01" name="sale_price" class="form-control" value="{{ product.sale_price or '' }}" min="0">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
                </div>

                <!-- Main Image -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Main Image</label>
                    <input type="file" name="main_image" class="form-control" accept="image/*">
                    {% if product.image %}
                    <div class="mt-2">
                        <img src="{{ url_for('static', filename='uploads/products/' + product.image) }}"
                             style="max-height: 120px; object-fit: contain;" class="border rounded">
                    </div>
                    {% endif %}
                </div>

                <hr>

                <!-- Variants -->
                <h5 class="mb-3">Variants</h5>
                {% for v in variants %}
                <div class="border p-3 mb-3 rounded bg-light">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label small">Variant Name</label>
                            <input type="text" name="variant_name[]" class="form-control" value="{{ v.variant_name }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">Price ($)</label>
                            <input type="number" step="0.01" name="variant_price[]" class="form-control" value="{{ v.price }}" min="0">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small">Stock</label>
                            <input type="number" name="variant_inventory[]" class="form-control" value="{{ v.inventory }}" min="0">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small">Image</label>
                            <input type="file" name="variant_image[]" class="form-control" accept="image/*">
                            {% if v.image %}
                            <img src="{{ url_for('static', filename='uploads/variants/' + v.image) }}"
                                 style="max-height: 60px; object-fit: contain;" class="mt-1 border rounded">
                            {% endif %}
                        </div>
                    </div>
                </div>
                {% endfor %}

                <button type="button" onclick="addNewVariantRow()" class="btn btn-outline-primary btn-sm">+ Add New Variant</button>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="/vendor/products" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success btn-lg">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function addNewVariantRow() {
    const container = document.getElementById('new-variants-container') ||
                      document.createElement('div'); // fallback
    // (add your existing addNewVariantRow logic here if needed)
}

// Global protection against negative numbers
document.addEventListener('input', function(e) {
    if (e.target.type === 'number') {
        if (parseFloat(e.target.value) < 0) {
            e.target.value = 0;
        }
    }
});
</script>
{% endblock %}
