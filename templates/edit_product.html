{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<h2>Edit Product</h2>
<form method="POST">
    <label>Title:</label><br>
    <input type="text" name="title" value="{{ product.title }}" required><br><br>
    
    <label>Price:</label><br>
    <input type="number" step="0.01" name="price" value="{{ product.price }}" required><br><br>
    
    <label>Inventory:</label><br>
    <input type="number" name="inventory" value="{{ product.inventory }}" required><br><br>
    
    <label>Description:</label><br>
    <textarea name="description" rows="4" cols="50">{{ product.description or '' }}</textarea><br><br>
    
    <button type="submit">Update Product</button>
</form>
{% endblock %}
