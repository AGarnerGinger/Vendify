{% extends "base.html" %}
{% block title %}Add New Product - Vendify{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add New Product</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label fw-bold">Title:</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Base Price ($):</label>
                        <input type="number" step="0.01" name="price" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Sale Price (optional - applies to all variants):</label>
                        <input type="number" step="0.01" name="sale_price" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Inventory (Stock):</label>
                    <input type="number" name="inventory" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description:</label>
                    <textarea name="description" class="form-control" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Main Product Image:</label>
                    <input type="file" name="main_image" class="form-control" accept="image/*">
                </div>

                <hr>
                <h5 class="mb-3">Variants</h5>
                <div id="variants-container"></div>

                <button type="button" onclick="addVariantRow()" class="btn btn-outline-primary mb-4">
                    + Add Another Variant
                </button>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Add Product + Variants</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let count = 0;

function addVariantRow() {
    count++;
    const container = document.getElementById('variants-container');

    const html = `
    <div class="border p-3 mb-3 rounded bg-light">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Variant Name:</label>
                <input type="text" name="variant_name[]" class="form-control" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label fw-bold">Price ($):</label>
                <input type="number" step="0.01" name="variant_price[]" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label fw-bold">Stock:</label>
                <input type="number" name="variant_inventory[]" class="form-control" value="10">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Variant Image:</label>
            <input type="file" name="variant_image[]" class="form-control" accept="image/*">
        </div>
    </div>`;
    container.innerHTML += html;
}

window.onload = function() {
    addVariantRow();
};
</script>
{% endblock %}
