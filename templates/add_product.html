{% extends "base.html" %}
{% block title %}Add New Product - Vendify{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add New Product</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">

                <label class="form-label fw-bold">Title:</label><br>
                <input type="text" name="title" class="form-control" required><br><br>

                <label class="form-label fw-bold">Price:</label><br>
                <input type="number" step="0.01" name="price" class="form-control" required><br><br>

                <label class="form-label fw-bold">Inventory (Stock):</label><br>
                <input type="number" name="inventory" class="form-control" required><br><br>

                <label class="form-label fw-bold">Sale Price (optional):</label><br>
                <input type="number" step="0.01" name="sale_price" class="form-control"><br><br>

                <label class="form-label fw-bold">Description:</label><br>
                <textarea name="description" class="form-control" rows="4"></textarea><br><br>

                <label class="form-label fw-bold">Main Product Image:</label><br>
                <input type="file" name="main_image" class="form-control" accept="image/*"><br><br>

                <hr>
                <h5 class="mb-3">Variants (Color, Size, Style, etc.)</h5>
                <div id="variants-container"></div>

                <button type="button" onclick="addVariantRow()" class="btn btn-outline-primary mb-4">
                    + Add Another Variant
                </button>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Add Product</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let count = 0;
function addVariantRow() {
    count++;
    const container = document.getElementById('variants-container');
    const html = `
    <div class="border p-3 mb-3 rounded">
        <label class="form-label fw-bold">Variant Name:</label><br>
        <input type="text" name="variant_name[]" class="form-control" required><br>

        <label class="form-label fw-bold">Variant Price:</label><br>
        <input type="number" step="0.01" name="variant_price[]" class="form-control"><br>

        <label class="form-label fw-bold">Variant Stock:</label><br>
        <input type="number" name="variant_inventory[]" class="form-control" value="10"><br>

        <label class="form-label fw-bold">Variant Image:</label><br>
        <input type="file" name="variant_image[]" class="form-control" accept="image/*">
    </div>`;
    container.innerHTML += html;
}
</script>
{% endblock %}
