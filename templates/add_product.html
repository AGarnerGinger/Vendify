{% extends "base.html" %}
{% block title %}Add New Product - Vendify{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add New Product</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Product Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Inventory</label>
                        <input type="number" name="inventory" class="form-control" min="0" value="10" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Regular Price ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control" min="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Sale Price ($)</label>
                        <input type="number" step="0.01" name="sale_price" class="form-control" min="0">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Description</label>
                    <textarea name="description" class="form-control" rows="4"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Main Product Image</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="mb-4 border p-4 rounded bg-light">
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="has_variants" onchange="toggleVariants()">
                        <label class="form-check-label fw-bold" for="has_variants">This product has variants</label>
                    </div>

                    <div id="variants-section" style="display: none;">
                        <button type="button" class="btn btn-outline-primary btn-sm mb-3" onclick="addVariantRow()">
                            + Add Variant
                        </button>
                        <div id="variant-rows"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100">Add Product</button>
            </form>
        </div>
    </div>
</div>

<script>
function toggleVariants() {
    document.getElementById('variants-section').style.display =
        document.getElementById('has_variants').checked ? 'block' : 'none';
}

function addVariantRow() {
    const container = document.getElementById('variant-rows');
    const row = document.createElement('div');
    row.className = 'row variant-row mb-3 align-items-end';
    row.innerHTML = `
        <div class="col-md-5">
            <label class="form-label small">Variant Name</label>
            <input type="text" name="variant_name[]" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label small">Price ($)</label>
            <input type="number" step="0.01" name="variant_price[]" class="form-control" min="0">
        </div>
        <div class="col-md-2">
            <label class="form-label small">Stock</label>
            <input type="number" name="variant_inventory[]" class="form-control" min="0" value="10" required>
        </div>
        <div class="col-md-2">
            <label class="form-label small">Image</label>
            <input type="file" name="variant_image[]" class="form-control" accept="image/*">
        </div>
        <div class="col-md-1 d-flex align-items-end">
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('.variant-row').remove()">✕</button>
        </div>
    `;
    container.appendChild(row);
}

// Global: Block negative numbers everywhere
document.addEventListener('input', function(e) {
    if (e.target.type === 'number') {
        if (e.target.value < 0) {
            e.target.value = 0;
        }
    }
});
</script>
{% endblock %}
