{% extends "base.html" %}
{% block title %}Complaints{% endblock %}
{% block content %}
<h2>Complaints / Returns / Warranty</h2>

<form method="POST">
    <label>Title:</label><br>
    <input type="text" name="title" required><br><br>
    
    <label>Description:</label><br>
    <textarea name="description" rows="5" required></textarea><br><br>
    
    <label>Type:</label><br>
    <select name="demand_type">
        <option value="return">Return</option>
        <option value="refund">Refund</option>
        <option value="warranty">Warranty Claim</option>
    </select><br><br>
    
    <button type="submit">Submit Request</button>
</form>

<hr>
<h3>Your Requests</h3>
{% for c in complaints %}
<div style="border:1px solid #ccc; padding:10px; margin:10px;">
    <strong>{{ c.title }} ({{ c.demand_type }})</strong> — 
    Status: <b>{{ c.status }}</b><br>
    {{ c.description }}
</div>
{% endfor %}
{% endblock %}
